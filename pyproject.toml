[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qradar-sdk"
version = "26.0.0"
description = "Python SDK for the IBM QRadar REST API"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Binh Nguyxn", email = "binhnd.dev@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
keywords = ["qradar", "ibm", "security", "siem", "api", "sdk"]

dependencies = [
    "requests>=2.25.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "responses>=0.20.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "types-requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/binhnguyen143/PyRadar"
Documentation = "https://github.com/binhnguyen143/PyRadar#readme"
Repository = "https://github.com/binhnguyen143/PyRadar"
Issues = "https://github.com/binhnguyen143/PyRadar/issues"

[tool.setuptools]
packages = ["qradar_sdk", "qradar_sdk.api"]

[tool.setuptools.package-data]
qradar_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
